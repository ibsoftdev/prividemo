<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos del Contratante - Cotización APS</title>
  <link rel="stylesheet" href="../../estilos-demo.css">
  <style>
    .cedula-rif-group { display: flex; align-items: stretch; gap: 0; max-width: 320px; }
    .cedula-rif-group .form-control { border-radius: 0; }
    .cedula-rif-group select.form-control { width: 59px; min-width: 59px; border-right: none; border-top-left-radius: var(--radius, 8px); border-bottom-left-radius: var(--radius, 8px); }
    .cedula-rif-group input.form-control { flex: 1; border-top-right-radius: var(--radius, 8px); border-bottom-right-radius: var(--radius, 8px); }
    .cedula-rif-group .form-control:focus { z-index: 1; }
    .telefono-group { display: flex; align-items: stretch; gap: 0; max-width: 280px; }
    .telefono-group .form-control { border-radius: 0; }
    .telefono-group select.form-control { width: 80px; min-width: 80px; border-right: none; border-top-left-radius: var(--radius, 8px); border-bottom-left-radius: var(--radius, 8px); }
    .telefono-group input.form-control { flex: 1; border-top-right-radius: var(--radius, 8px); border-bottom-right-radius: var(--radius, 8px); }
    .telefono-group .form-control:focus { z-index: 1; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="flow-header">
      <h1>Cotización Accidentes Personales</h1>
      <p>Paso 2: Datos del Contratante</p>
    </header>

    <div class="stepper">
      <div class="step done">
        <span class="step-num">✓</span>
        <span class="step-label">Búsqueda</span>
      </div>
      <span class="step-connector"></span>
      <div class="step active">
        <span class="step-num">2</span>
        <span class="step-label">Contratante</span>
      </div>
      <span class="step-connector"></span>
      <div class="step">
        <span class="step-num">3</span>
        <span class="step-label">Grupo Familiar</span>
      </div>
      <span class="step-connector"></span>
      <div class="step">
        <span class="step-num">4</span>
        <span class="step-label">Resumen</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Datos del Contratante</div>
      <div class="card-body">
        <div class="form-group">
          <label for="NumID">Cédula / R.I.F.</label>
          <div class="cedula-rif-group">
            <select id="TipoID" class="form-control" aria-label="Tipo de identificación">
              <option value="">--</option>
              <option value="V">V</option>
              <option value="E">E</option>
              <option value="J">J</option>
            </select>
            <input type="text" id="NumID" class="form-control" placeholder="Ej: 12345678" maxlength="9" aria-label="Número de cédula o RIF">
          </div>
          <span class="help">Máximo 9 dígitos</span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="PrimNombre">Nombre</label>
            <input type="text" id="PrimNombre" class="form-control" placeholder="Ej: Juan">
          </div>
          <div class="form-group">
            <label for="SegNombre">Apellido</label>
            <input type="text" id="SegNombre" class="form-control" placeholder="Opcional">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="Email">Correo electrónico</label>
            <input type="email" id="Email" class="form-control" placeholder="ejemplo@correo.com">
          </div>
          <div class="form-group">
            <label for="TelefonoNum">Teléfono</label>
            <div class="telefono-group">
              <select id="TelefonoCod" class="form-control" aria-label="Código de área">
                <option value="0412">0412</option>
                <option value="0414">0414</option>
                <option value="0416">0416</option>
              </select>
              <input type="tel" id="TelefonoNum" class="form-control" placeholder="Ej: 1234567" inputmode="numeric" pattern="[0-9]*" maxlength="7" aria-label="Número de teléfono">
            </div>
          </div>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary">Cancelar</button>
          <button type="button" class="btn btn-primary">Continuar</button>
        </div>
      </div>
    </div>

    <div class="nav-links">
      <a href="01-consulta.html" class="prev">← Búsqueda</a>
      <a href="04-asegurados.html" class="next">Siguiente: Asegurados →</a>
    </div>
  </div>
</body>
</html>
